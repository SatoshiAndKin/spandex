name: Weekly upstream Renovate

on:
  schedule:
    - cron: "15 17 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate-upstream

jobs:
  renovate:
    if: github.repository == 'SatoshiAndKin/spandex'
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: SatoshiAndKin/spandex/.github/workflows/renovate-upstream-reviewed-linux.yml@196cd47498cc5f9fd9a7bf9a0e104aae4bf23f9e
