name: Site building
on:
  pull_request:

concurrency:
  group: pr-ci-site.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-slim

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build site
        working-directory: ./site
        run: bun run build
